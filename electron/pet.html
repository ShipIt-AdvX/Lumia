<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    -webkit-app-region: no-drag;
  }
  #stage {
    position: absolute;
    left: 0; top: 0;
    width: 100%; height: 100%;
  }
  .sprite-layer {
    position: absolute;
    left: 0; top: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    pointer-events: none;
    transition: opacity .2s ease-out;
  }
  #spriteA { z-index: 1; opacity: 1; }
  #spriteB { z-index: 2; opacity: 0; }

  #hit {
    position: absolute;
    left: 0; top: 0;
    width: 100%; height: 100%;
    cursor: grab;
    z-index: 10;
  }
  #hit.dragging { cursor: grabbing; }

  #menu {
    position: fixed;
    display: none;
    background: rgba(24,25,38,.96);
    border: 1px solid #e0887a;
    border-radius: 10px;
    padding: 6px 0;
    min-width: 130px;
    z-index: 999;
    box-shadow: 0 8px 30px rgba(0,0,0,.6);
  }
  #menu div {
    padding: 7px 18px;
    font-size: 12px;
    color: #ccc;
    cursor: pointer;
    font-family: 'Segoe UI', sans-serif;
    transition: background .12s;
  }
  #menu div:hover { background: #e0887a; color: #fff; }
  #menu hr { border: none; border-top: 1px solid rgba(255,255,255,.08); margin: 4px 8px; }

  #bubble {
    position: absolute;
    top: 0; left: 50%;
    transform: translate(-50%, -100%);
    background: rgba(255,255,255,.92);
    color: #333;
    font-size: 13px;
    font-family: 'Segoe UI', sans-serif;
    padding: 6px 14px;
    border-radius: 14px;
    white-space: nowrap;
    opacity: 0;
    transition: opacity .25s;
    pointer-events: none;
    box-shadow: 0 2px 10px rgba(0,0,0,.2);
    z-index: 20;
  }
  #bubble.show { opacity: 1; }
  #bubble::after {
    content: '';
    position: absolute;
    bottom: -6px; left: 50%;
    margin-left: -6px;
    border: 6px solid transparent;
    border-top-color: rgba(255,255,255,.92);
    border-bottom: 0;
  }
</style>
</head>
<body>

<div id="stage">
  <img id="spriteA" class="sprite-layer" src="pet/Idle.png" draggable="false" />
  <img id="spriteB" class="sprite-layer" src="pet/Idle.png" draggable="false" />
</div>
<div id="bubble"></div>
<div id="hit"></div>

<div id="menu">
  <div data-action="pet">摸摸头</div>
  <div data-action="smile">微笑</div>
  <div data-action="laugh">大笑</div>
  <div data-action="surprised">吓一跳</div>
  <div data-action="excited">激动</div>
  <div data-action="unamused">发呆</div>
  <hr>
  <div data-action="signature">招牌动作</div>
  <div data-action="walk">去散步</div>
  <hr>
  <div data-action="hide">隐藏</div>
</div>

<script>
'use strict';

// ======= Sprite crossfade engine =======
const SPRITES = {
  idle: 'pet/Idle.png', side: 'pet/Side View.png',
  smile: 'pet/Smile.png', laugh: 'pet/Laugh.png',
  surprised: 'pet/Surprised.png', excited: 'pet/Excited.png',
  unamused: 'pet/Unamused.png', signature: 'pet/Signature Pose.png',
  happy: 'pet/happy.png',
};

const imgA = document.getElementById('spriteA');
const imgB = document.getElementById('spriteB');
let active = imgA, inactive = imgB;

function crossfade(sprite) {
  const src = SPRITES[sprite] || SPRITES.idle;
  const img = new Image();
  img.src = src;
  img.onload = () => {
    inactive.src = src;
    inactive.style.opacity = '1';
    active.style.opacity = '0';
    [active, inactive] = [inactive, active];
    bounce();
  };
  if (img.complete) {
    inactive.src = src;
    inactive.style.opacity = '1';
    active.style.opacity = '0';
    [active, inactive] = [inactive, active];
    bounce();
  }
}

function bounce() {
  active.style.transition = 'none';
  active.style.transform = 'scale(1.1)';
  requestAnimationFrame(() => {
    active.style.transition = 'transform .3s cubic-bezier(.34,1.56,.64,1)';
    active.style.transform = 'scale(1)';
  });
}

// ======= Thought bubble =======
const bubble = document.getElementById('bubble');
let bubbleTimer;

function say(text, ms = 2200) {
  bubble.textContent = text;
  bubble.classList.add('show');
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => bubble.classList.remove('show'), ms);
}

// ======= State machine =======
// idle       → default, after any expression expires
// smile      → 1 click, gentle pet, drag-release
// laugh      → 2 rapid clicks
// excited    → 3+ rapid clicks
// surprised  → drag-start, notification arrives
// unamused   → 3 min no interaction
// signature  → right-click menu
// walking    → auto-walk timer / menu

let state = 'idle';
let expireTimer = null;
let lastTouch = Date.now();
let clickCount = 0;
let clickChainTimeout = null;

function setState(s, opts = {}) {
  const { dur = 0, sprite = s, text = null, bounce: b = true } = opts;
  if (state === s && !opts.force) return;
  clearTimeout(expireTimer);
  state = s;
  lastTouch = s !== 'idle' && s !== 'unamused' ? Date.now() : lastTouch;
  crossfade(sprite);
  if (b && s !== 'idle') bounce();
  if (text) say(text);
  if (dur > 0) {
    expireTimer = setTimeout(() => {
      if (state === s) goIdle(false);
    }, dur);
  }
}

function goIdle(bounce = false) {
  clearTimeout(expireTimer);
  state = 'idle';
  crossfade('idle');
  if (bounce) bounce();
  startIdleAnim();
  resetBoredom();
  scheduleWalk();
}

// ======= Idle animation: breathing =======
let idleRAF = null;
let breathT = 0;

function startIdleAnim() {
  stopIdleAnim();
  const loop = () => {
    if (state !== 'idle' && state !== 'unamused') { idleRAF = null; return; }
    breathT += 0.04;
    const bob = Math.sin(breathT * 2) * 2;
    const scl = 1 + Math.sin(breathT * 2) * 0.01;
    active.style.transform = `translateY(${bob}px) scale(${scl})`;
    idleRAF = requestAnimationFrame(loop);
  };
  idleRAF = requestAnimationFrame(loop);
}

function stopIdleAnim() {
  if (idleRAF) { cancelAnimationFrame(idleRAF); idleRAF = null; }
  active.style.transform = '';
}

// ======= Boredom: 3 min idle → unamused =======
let boredomTimer = null;
function resetBoredom() {
  clearTimeout(boredomTimer);
  boredomTimer = setTimeout(() => {
    if (state === 'idle') {
      setState('unamused', { dur: 6000, text: '好安静…' });
      startIdleAnim();
    }
  }, 180000);
}

// =======
//  Left-click  → expression chain (1=smile, 2=laugh, 3+=excited)
//  Right-click hold → drag pet
//  Right-click tap → context menu
// =======
const hit = document.getElementById('hit');
let ldown = null;     // left-click state
let rdown = null;     // right-click state
let rHolding = false; // right button held > threshold
const R_HOLD_MS = 220;
let rHoldTimer = null;
let dragging = false;

// --- Left click (expression chain) ---
hit.addEventListener('mousedown', (e) => {
  hideMenu();
  if (e.button === 0) {
    ldown = { t: Date.now() };
    return;
  }
  if (e.button === 2) {
    rdown = { sx: e.screenX, sy: e.screenY, t: Date.now() };
    rHolding = false;
    // Start hold timer — if still held after R_HOLD_MS, enter drag mode
    clearTimeout(rHoldTimer);
    rHoldTimer = setTimeout(() => {
      if (rdown && !rHolding) {
        rHolding = true;
        dragging = true;
        hit.classList.add('dragging');
        stopIdleAnim();
        setState('surprised', { dur: 500, sprite: 'surprised', bounce: true });
        window.electronAPI?.petDragStart();
      }
    }, R_HOLD_MS);
    return;
  }
});

document.addEventListener('mouseup', (e) => {
  if (e.button === 0 && ldown) {
    // Left click released → was it a click? (not consumed by drag)
    const dt = Date.now() - ldown.t;
    ldown = null;
    if (dragging) return; // somehow concurrent, skip
    if (dt < 500) {
      clickCount++;
      clearTimeout(clickChainTimeout);
      clickChainTimeout = setTimeout(() => { clickCount = 0; }, 1300);
      if (clickCount === 1) {
        setState('smile', { dur: 1200, text: '｡◕‿◕｡' });
        startIdleAnim();
      } else if (clickCount === 2) {
        setState('laugh', { dur: 1800, text: '哈哈！' });
        startIdleAnim();
      } else if (clickCount >= 3) {
        clickCount = 0;
        setState('excited', { dur: 2500, text: '太开心啦！！' });
        startIdleAnim();
      }
      resetBoredom();
    }
  }

  if (e.button === 2) {
    clearTimeout(rHoldTimer);
    if (dragging && rHolding) {
      // Was dragging → end drag
      dragging = false;
      rHolding = false;
      hit.classList.remove('dragging');
      window.electronAPI?.petDragEnd();
      goIdle(true);
      say('放我下来啦~');
    } else if (rdown) {
      // Short right-click → context menu
      const dx = Math.abs(e.screenX - rdown.sx);
      const dy = Math.abs(e.screenY - rdown.sy);
      if (dx <= 5 && dy <= 5) {
        showMenu(e.clientX, e.clientY);
      }
    }
    rdown = null;
    rHolding = false;
  }
});

// ======= Right-click menu =======
function showMenu(cx, cy) {
  const m = document.getElementById('menu');
  m.style.display = 'block';
  m.style.left = Math.min(cx, window.innerWidth - 150) + 'px';
  m.style.top  = Math.min(cy, window.innerHeight - 270) + 'px';
}

// Removed old contextmenu handler — menu now shown in mouseup

document.getElementById('menu').addEventListener('click', (e) => {
  const act = e.target.dataset.action;
  if (!act) return;
  hideMenu();
  switch (act) {
    case 'pet':      setState('smile', { dur: 2000, text: '好舒服~' }); startIdleAnim(); break;
    case 'smile':    setState('smile', { dur: 2500, text: '^-^' }); startIdleAnim(); break;
    case 'laugh':    setState('laugh', { dur: 2500, text: '哈哈！' }); startIdleAnim(); break;
    case 'surprised':setState('surprised', { dur: 2000, text: '？！' }); startIdleAnim(); break;
    case 'excited':  setState('excited', { dur: 2500, text: '耶！' }); startIdleAnim(); break;
    case 'unamused': setState('unamused', { dur: 4000, text: '……' }); startIdleAnim(); break;
    case 'signature':setState('signature', { dur: 3000, text: '看招！' }); startIdleAnim(); break;
    case 'walk':     startWalk(); break;
    case 'hide':     window.electronAPI?.togglePet(); break;
  }
  lastTouch = Date.now();
  resetBoredom();
});

function hideMenu() { document.getElementById('menu').style.display = 'none'; }
// Prevent system context menu
document.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('click', (e) => {
  if (!e.target.closest('#menu') && e.target !== hit) hideMenu();
});

// ======= Auto-walk =======
let walkTimer = null;
let walking = false;

function startWalk() {
  if (!isIdleish()) return;
  stopIdleAnim();
  walking = true;
  state = 'walking';
  crossfade('side');
  const r = hit.getBoundingClientRect();
  const sw = window.screen.width;
  const sh = window.screen.height;
  const fromX = r.left + r.width / 2;
  const fromY = r.top + r.height / 2;
  const dist = 100 + Math.random() * 200;
  const dir = Math.random() < 0.5 ? -1 : 1;
  let tx = fromX + dir * dist;
  let ty = fromY + (Math.random() - 0.5) * 50;
  // Keep on taskbar "floor"
  ty = Math.max(sh - 350, Math.min(sh - 60, ty));
  tx = Math.max(50, Math.min(sw - 50, tx));
  const facingRight = tx > fromX;
  const totalLen = Math.hypot(tx - fromX, ty - fromY);
  const duration = Math.max(500, totalLen * 3.5);
  const t0 = performance.now();

  const step = (now) => {
    const t = Math.min(1, (now - t0) / duration);
    const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    const x = fromX + (tx - fromX) * e;
    const y = fromY + (ty - fromY) * e;
    const bob = Math.abs(Math.sin(t * Math.PI * 5)) * 3;
    active.style.transform = `scaleX(${facingRight ? 1 : -1}) translateY(${-bob}px)`;
    window.electronAPI?.movePet(Math.round(x), Math.round(y));
    if (t < 1) requestAnimationFrame(step);
    else {
      walking = false;
      active.style.transform = '';
      goIdle(false);
    }
  };
  requestAnimationFrame(step);
}

function isIdleish() { return state === 'idle' || state === 'unamused'; }

function scheduleWalk() {
  clearTimeout(walkTimer);
  walkTimer = setTimeout(() => {
    if (isIdleish() && Math.random() < 0.4) startWalk();
    else scheduleWalk();
  }, 10000 + Math.random() * 18000);
}

// ======= External commands (from dev panel) =======
function handlePetCmd(action) {
  switch (action) {
    case 'toggle': window.electronAPI?.togglePet(); return;
    case 'idle': goIdle(true); return;
    case 'smile': setState('smile', { dur: 3000, text: '^-^' }); startIdleAnim(); break;
    case 'laugh': setState('laugh', { dur: 3000, text: '哈哈！' }); startIdleAnim(); break;
    case 'surprised': setState('surprised', { dur: 2500, text: '？！' }); startIdleAnim(); break;
    case 'excited': setState('excited', { dur: 3000, text: '耶耶耶！' }); startIdleAnim(); break;
    case 'unamused': setState('unamused', { dur: 4000, text: '…' }); startIdleAnim(); break;
    case 'signature': setState('signature', { dur: 3500, text: '看招！' }); startIdleAnim(); break;
    case 'walk': startWalk(); break;
  }
  resetBoredom();
}

// ======= Boot =======
window.addEventListener('load', () => {
  imgA.style.opacity = '1';
  imgB.style.opacity = '0';
  startIdleAnim();
  resetBoredom();
  scheduleWalk();
  if (window.electronAPI?.onPetCmd) {
    window.electronAPI.onPetCmd(handlePetCmd);
  }
  setTimeout(() => say('我来啦~', 2000), 600);
});
</script>
</body>
</html>
