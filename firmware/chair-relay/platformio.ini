; Waveshare ESP32-S3-Nano（ESP32-S3R8，兼容 Arduino Nano ESP32）
; USB 为 Espressif 303a:1001，用 esptool，不要用官方 Nano 的 DFU
[env:esp32_s3_nano]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
upload_protocol = esptool
upload_speed = 921600
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DPIN_A7=14
  -DPIN_A6=13
  -DPIN_A5=12
  -DPIN_A4=11
  -I.
lib_ldf_mode = deep+
